title: MongoDB Performance Guide
description: A comprehensive guide to MongoDB performance optimization from beginner to advanced
baseurl: "/mongodb-performance-docs"
url: "https://tarek-bs23.github.io"

# Theme settings
remote_theme: just-the-docs/just-the-docs
color_scheme: dark
search_enabled: true
heading_anchors: true
logo: ""  # This removes any logo and just shows the title
aux_nav_spacing: normal  # Adjusts the spacing in the navigation

# Navigation ordering
nav:
  sort: true  # Enables sorting
  sort_by: title  # Sort by title

# Navigation
nav_external_links:
  - title: GitHub Repository
    url: https://github.com/tarek-bs23/mongodb-performance-docs
    hide_icon: false

aux_links:
  "View on GitHub":
    - "https://github.com/tarek-bs23/mongodb-performance-docs"

# Enable copy code button
enable_copy_code_button: true

# Footer content
footer_content: "Copyright &copy; 2025 MongoDB Performance Guide. Distributed under an MIT license."

# Collections for better organization
collections:
  docs:
    permalink: "/:collection/:path/"
    output: true

just_the_docs:
  collections:
    docs:
      name: Documentation
